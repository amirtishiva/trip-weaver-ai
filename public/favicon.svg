<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="globe-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9" />
      <stop offset="1" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="16" cy="16" r="14" stroke="url(#globe-grad)" stroke-width="2" opacity="0.3" />
  
  <!-- Stylized Globe Grid -->
  <path d="M16 2A14 14 0 0 1 16 30M2 16A14 14 0 0 1 30 16" stroke="url(#globe-grad)" stroke-width="1" opacity="0.2" />
  <ellipse cx="16" cy="16" rx="8" ry="14" stroke="url(#globe-grad)" stroke-width="1" opacity="0.2" fill="none" />
  
  <!-- AI Node / Pulse -->
  <circle cx="16" cy="16" r="5" fill="url(#globe-grad)" filter="url(#glow)" />
  
  <!-- Paper Plane / Arrow -->
  <path d="M14 14L18 16L14 18V14Z" fill="white" />
  <path d="M18 16L13 15.5V16.5L18 16Z" fill="white" opacity="0.8" />
</svg>
